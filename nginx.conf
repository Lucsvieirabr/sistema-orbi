server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Nao anunciar a versao do nginx (reduz fingerprinting).
    server_tokens off;

    # ------------------------------------------------------------------
    # Cabecalhos de seguranca
    # ------------------------------------------------------------------
    # ATENCAO nginx: `add_header` dentro de um `location` DESCARTA todos os
    # add_header herdados do server. Por isso os headers sao repetidos em
    # cada bloco location abaixo — sem isso os assets e o index.html saiam
    # sem CSP nenhuma (era o comportamento anterior deste arquivo).
    #
    # O JWT do Supabase vive em localStorage (nao ha HttpOnly no fluxo SPA),
    # entao a CSP e a principal barreira contra roubo de sessao via XSS.
    #
    # ------------------------------------------------------------------
    set $orbi_csp "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cloudflareinsights.com blob: data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; upgrade-insecure-requests";

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Content-Security-Policy $orbi_csp always;

    # Configuração para SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Content-Security-Policy $orbi_csp always;
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }

    # Desabilitar cache para index.html
    location = /index.html {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Content-Security-Policy $orbi_csp always;
    }

    # SEO: robots.txt / sitemap.xml / llms.txt servidos como arquivo (nunca o index.html).
    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
        try_files $uri =404;
        expires 1h;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SEO: area autenticada/admin fora do indice. Repete os headers (heranca do add_header).
    location ~ ^/(sistema|admin|billing)(/|$) {
        try_files $uri /index.html;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Content-Security-Policy $orbi_csp always;
    }

    # Nunca servir arquivos de configuracao/segredo que caiam no docroot.
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }
}
