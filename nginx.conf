server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Nao anunciar a versao do nginx (reduz fingerprinting).
    server_tokens off;

    # ------------------------------------------------------------------
    # Cabecalhos de seguranca
    # ------------------------------------------------------------------
    # ATENCAO nginx: `add_header` dentro de um `location` DESCARTA todos os
    # add_header herdados do server. Por isso os headers sao repetidos em
    # cada bloco location abaixo — sem isso os assets e o index.html saiam
    # sem CSP nenhuma (era o comportamento anterior deste arquivo).
    #
    # O JWT do Supabase vive em localStorage (nao ha HttpOnly no fluxo SPA),
    # entao a CSP e a principal barreira contra roubo de sessao via XSS.
    #
    # TODO: trocar `connect-src https: wss:` pela URL exata do projeto Supabase.
    # ------------------------------------------------------------------
    set $orbi_csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss: blob: data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Content-Security-Policy $orbi_csp always;

    # Configuração para SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Content-Security-Policy $orbi_csp always;
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }

    # Desabilitar cache para index.html
    location = /index.html {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Content-Security-Policy $orbi_csp always;
    }

    # Nunca servir arquivos de configuracao/segredo que caiam no docroot.
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }
}
