# ============================================================================
# Netlify — SPA + cabecalhos de seguranca
# ============================================================================
# O arquivo so tinha o rewrite de SPA: nenhum header de seguranca era enviado.
# Como o JWT do Supabase fica em localStorage (exigencia do supabase-js: nao
# ha modo HttpOnly no fluxo SPA), um XSS equivale a roubo de sessao. A CSP
# abaixo e a principal defesa: bloqueia script inline e origem nao declarada.
#
# TODO (endurecer apos o go-live): trocar `connect-src https: wss:` pela URL
# exata do projeto Supabase, ex.:
#   connect-src 'self' https://<projeto>.supabase.co wss://<projeto>.supabase.co
# ============================================================================

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # HSTS: 1 ano, subdominios inclusos. Impede downgrade para http.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Clickjacking: o app nao e embutido em lugar nenhum.
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

    # Nao vazar path/query (que podem conter ids) para terceiros.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Desliga APIs que o app nao usa.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

    # Isola o contexto de navegacao (protege contra XS-Leaks).
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-site"

    # CSP:
    #  - script-src sem 'unsafe-inline': mata a classe principal de XSS.
    #  - 'wasm-unsafe-eval' + blob: sao exigidos por tesseract.js (OCR) e pdf.js.
    #  - cdnjs/jsdelivr/unpkg: workers e core do pdf.js e do tesseract.js.
    #  - tessdata.projectnaptha.com: modelos de linguagem do OCR.
    #  - style-src 'unsafe-inline': Radix/shadcn injetam estilo inline.
    #  - frame-ancestors 'none' reforca o X-Frame-Options.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss: blob: data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# SEO: area autenticada/admin fora do indice mesmo que um link externo aponte.
[[headers]]
  for = "/sistema/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/billing"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Arquivos de indexacao (robots/sitemap/llms): tipo correto e cache curto.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Assets com hash no nome: cache longo e imutavel.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# O HTML nunca pode ser cacheado (senao o usuario fica preso a um bundle velho).
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
