# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "sistema-orbi"

[api]
enabled = true
# Port to use for the API URL.
port = 54331
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API endpoints.
# public and storage are always included.
schemas = ["public", "storage", "graphql_public"]
# Extra schemas to add to the search_path of every request. public is always included.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returned from a table or view. Limits payload size
# for accidental or malicious requests.
max_rows = 1000

[db]
# Port to use for the local database URL.
port = 54333
# Port used by db diff command to initialize the shadow database.
shadow_port = 54330
# The database major version to use. This has to be the same as your remote database's. Run `SHOW server_version;` on the remote database to check.
major_version = 15

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54339
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

[realtime]
enabled = true
# Bind realtime via either IPv4 or IPv6. (default: IPv6)
# ip_version = "IPv6"

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54335
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1:54331"

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
[inbucket]
enabled = true
# Port to use for the email testing server web interface.
port = 54334
# Uncomment to expose additional ports for testing user applications that send emails.
# smtp_port = 54325
# pop3_port = 54326

[storage]
enabled = false
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used
# in emails.
site_url = "http://localhost:8080"
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
# /redefinir-senha precisa estar aqui: e o `redirectTo` do e-mail de recuperacao
# (src/services/auth/password-recovery.ts). Fora da lista o GoTrue ignora o
# redirectTo e manda para o site_url. Producao: painel > Auth > URL Configuration.
additional_redirect_urls = [
  "http://localhost:8080/redefinir-senha",
  "http://127.0.0.1:8080/redefinir-senha",
]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604800 (1 week).
jwt_expiry = 3600
# If disabled, the refresh token will never expire.
enable_refresh_token_rotation = true
# Allows refresh tokens to be reused after expiry, up to the specified interval in seconds.
# Requires enable_refresh_token_rotation = true.
refresh_token_reuse_interval = 10
# Allow/disallow new user signups to your project.
enable_signup = true
# Espelho server-side de src/lib/password-strength.ts (8+ chars, letras e
# numeros). O client e UX; o GoTrue recusa com `weak_password`.
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
# Allow/disallow new user signups via email to your project.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email addresses. If disabled, only the new email is required to confirm.
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in.
enable_confirmations = false
# Intervalo minimo entre e-mails para o mesmo usuario (recover, confirm).
max_frequency = "60s"
# Validade do link de recuperacao (segundos). A UI promete 1 hora.
otp_expiry = 3600

# Link de recuperacao com token_hash: funciona em qualquer navegador (o
# `?code=` do PKCE so no que pediu) e so e consumido quando o usuario envia a
# nova senha — scanner de e-mail que abre o link nao queima o token.
[auth.email.template.recovery]
subject = "Redefina sua senha do Orbi"
content_path = "./supabase/templates/recovery.html"

# Uncomment to customize email template
# [auth.email.template.invite]
# subject = "You have been invited"
# content_path = "./supabase/templates/invite.html"

[auth.sms]
# Allow/disallow new user signups via SMS to your project.
enable_signup = true
# If enabled, users need to confirm their phone number before signing in.
enable_confirmations = false

# Configure one of the supported SMS providers: `twilio`, `messagebird`, `textlocal`, `vonage`.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
# DO NOT commit your Twilio auth token to git. Use environment variable substitution instead:
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# Use pre-defined map of phone number to OTP for testing.
[auth.sms.test_otp]
# 4152127777 = "123456"

# ============================================================================
# MFA (TOTP)
# ============================================================================
# Sessao nasce aal1 (senha) e vira aal2 depois do codigo do app autenticador.
# O front redireciona para /login/verificacao; RLS sensivel exige aal2
# (public.orbi_mfa_satisfied / auth.jwt()->>'aal').
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Configure one of the supported captcha providers: `hcaptcha`, `turnstile`.
[auth.captcha]
# Ligar em producao: e a unica defesa contra credential stuffing distribuido
# (o rate limit abaixo e por IP; botnet troca de IP, captcha nao).
# Cloudflare Turnstile: o front manda `captchaToken` em signInWithPassword,
# signUp e resetPasswordForEmail (src/components/auth/TurnstileField.tsx) e o
# GoTrue chama o siteverify com o secret abaixo. Local fica desligado: o
# secret nao existe neste repo. Producao: painel > Auth > Attack Protection.
# Ligar SO depois do deploy do front com VITE_TURNSTILE_SITE_KEY — antes disso
# todo login falha com `captcha_failed`.
enabled = false
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

# ============================================================================
# RATE LIMIT DE AUTENTICACAO
# ============================================================================
# /auth/v1/* NAO passa pelas Edge Functions — e o GoTrue direto. O limitador
# do _shared/ratelimit.ts nao alcanca essas rotas; o teto tem que ser aqui.
# Sem isto, login/signup/recover ficavam abertos a enumeracao de e-mail,
# brute-force de senha e flood de e-mail transacional (que e custo por envio).
# Valores por hora, por IP.
[auth.rate_limit]
# E-mails transacionais (signup, recover, magic link, change email).
email_sent = 10
# SMS (provider desligado hoje; teto mantido para nao nascer aberto).
sms_sent = 10
# Login + signup: 30/h/IP absorve usuario legitimo errando a senha e mata
# o brute-force barato.
sign_in_sign_ups = 30
# Verificacao de OTP/token (recover, invite, confirm).
token_verifications = 30
# Refresh de sessao: alto de proposito, e chamado por aba aberta.
token_refresh = 150
# Signup anonimo: nao usamos.
anonymous_users = 10

# Use an external OAuth provider. The full list of providers are: `apple`, `azure`, `bitbucket`,
# `discord`, `facebook`, `github`, `gitlab`, `google`, `keycloak`, `linkedin`, `notion`, `twitch`,
# `twitter`, `slack`, `spotify`, `workos`, `zoom`.
[auth.external.apple]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# Overrides the default auth redirectUrl.
redirect_uri = ""
# Overrides the default auth provider URL. Used to support self-hosted gitlab, single-tenant Azure,
