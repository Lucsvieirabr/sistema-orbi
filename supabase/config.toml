# ============================================================================
# EDGE FUNCTIONS — verify_jwt declarado em TODAS
# ============================================================================
# O default varia entre versoes do CLI. Declarar explicitamente evita que uma
# funcao autenticada nasca publica por regressao de tooling.
# Unica com verify_jwt = false: o webhook do Asaas (chamador e o gateway, nao
# um usuario). Ele se autentica por asaas-access-token + rate limit por IP.

[functions.asaas-webhook-handler]
verify_jwt = false

[functions.asaas-create-customer]
verify_jwt = true

[functions.asaas-create-payment]
verify_jwt = true

[functions.asaas-manage-subscription]
verify_jwt = true

[functions.asaas-sync-subscription]
verify_jwt = true

[functions.classify-transactions]
verify_jwt = true

[functions.extract-pdf-text]
verify_jwt = true
